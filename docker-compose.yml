# ── Healthcare OS — Development Environment ──────────────────
# Single-command startup: docker compose up
#
# Services:
#   db       — PostgreSQL 16 (canonical cloud data)
#   redis    — Redis 7 (cache, queues, Channels)
#   minio    — MinIO (S3-compatible object storage)
#   backend  — Django 5.1 + DRF (API server)
#   worker   — Celery worker (async tasks)
#   frontend — Next.js 14 (web app)
#   nginx    — Reverse proxy

services:
  # ── Database ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: healthcare-os-db
    environment:
      POSTGRES_USER: healthcare_os
      POSTGRES_PASSWORD: healthcare_os
      POSTGRES_DB: healthcare_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_os"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Cache & Message Broker ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healthcare-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Object Storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: healthcare-os-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Django API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: healthcare-os-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=healthcare_os.settings.dev
      - SECRET_KEY=dev-secret-key-change-in-production-xxxxxxxxxxxx
      - DEBUG=true
      - DATABASE_URL=postgres://healthcare_os:healthcare_os@db:5432/healthcare_os
      - REDIS_URL=redis://redis:6379
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=healthcare-os-dev
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ───────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: healthcare-os-worker
    command: celery -A healthcare_os worker -l info -c 4
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=healthcare_os.settings.dev
      - SECRET_KEY=dev-secret-key-change-in-production-xxxxxxxxxxxx
      - DEBUG=true
      - DATABASE_URL=postgres://healthcare_os:healthcare_os@db:5432/healthcare_os
      - REDIS_URL=redis://redis:6379
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=healthcare-os-dev
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (scheduled tasks) ───────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: healthcare-os-beat
    command: celery -A healthcare_os beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=healthcare_os.settings.dev
      - SECRET_KEY=dev-secret-key-change-in-production-xxxxxxxxxxxx
      - DATABASE_URL=postgres://healthcare_os:healthcare_os@db:5432/healthcare_os
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Next.js Frontend ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: healthcare-os-frontend
    command: sh -c "cd /app && npm run dev --workspace=frontend"
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - /app/frontend/node_modules
      - /app/frontend/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: healthcare-os-nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
    ports:
      - "6776:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_volume:
